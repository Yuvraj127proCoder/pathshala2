<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="A welcoming learning community for students and teachers.">
  <title>Learnspace — grow together</title>
  <link rel="stylesheet" href="assets/style.css?v=2">
  <script type="module" src="assets/app.js?v=3"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Main menu">
      <a class="brand" href="#home" aria-label="Learnspace home">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span>learnspace<span class="brand-period">.</span></span>
      </a>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-view="home"><span class="nav-icon" data-icon="home"></span><span>Overview</span></button>
        <button class="nav-item" data-view="discover"><span class="nav-icon" data-icon="compass"></span><span>Discover</span></button>
        <button class="nav-item" data-view="classes"><span class="nav-icon" data-icon="calendar"></span><span>Classes</span><span class="nav-count" id="classNavCount"></span></button>
        <button class="nav-item" data-view="community"><span class="nav-icon" data-icon="people"></span><span>Community</span></button>
        <button class="nav-item" data-view="storage"><span class="nav-icon" data-icon="folder"></span><span>My storage</span></button>
        <button class="nav-item" data-view="messages"><span class="nav-icon" data-icon="message"></span><span>Messages</span><span class="nav-count nav-unread" id="messageNavCount"></span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-note">
        <div class="note-orbit">✳</div>
        <strong>A little progress<br>goes a long way.</strong>
        <span>Show up, stay curious.</span>
        <div class="note-decoration note-decoration-one"></div><div class="note-decoration note-decoration-two"></div>
      </div>
      <button class="nav-item settings-link" data-action="edit-profile"><span class="nav-icon" data-icon="settings"></span><span>Profile & settings</span></button>
      <div class="sidebar-profile" id="sidebarProfile"></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" data-action="mobile-menu" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div class="breadcrumb"><span>Workspace</span><i>/</i><strong id="breadcrumbCurrent">Overview</strong></div>
        <div class="topbar-actions">
          <label class="global-search"><span data-icon="search"></span><input id="globalSearch" type="search" placeholder="Search people, classes..." aria-label="Search people and classes"><kbd>⌘ K</kbd></label>
          <button class="icon-button notification-button" data-action="notifications" aria-label="Notifications"><span data-icon="bell"></span><i></i></button>
          <div class="topbar-avatar" id="topbarAvatar"></div>
        </div>
      </header>
      <section class="page-container" id="pageContainer" aria-live="polite"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
